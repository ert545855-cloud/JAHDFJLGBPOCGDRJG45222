<g class="b">
<path class="wv" d="M34 100 Q14 92 18 74 Q30 84 40 86Z" fill="#ffcf2e" stroke="#e0a200" stroke-width="2.4" stroke-linejoin="round"/><path class="wv2" d="M126 100 Q146 92 142 74 Q130 84 120 86Z" fill="#ffcf2e" stroke="#e0a200" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M30 98 C30 60 52 40 80 40 C108 40 130 60 130 98 C130 124 110 134 80 134 C50 134 30 124 30 98Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
