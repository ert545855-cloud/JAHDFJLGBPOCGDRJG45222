<path d="M30 98 C30 60 52 40 80 40 C108 40 130 60 130 98 C130 124 110 134 80 134 C50 134 30 124 30 98Z" fill="url(#h)"/>
<path d="M76 42 Q72 28 80 26 M80 42 Q82 26 90 30" fill="none" stroke="#e6a400" stroke-width="3.4" stroke-linecap="round"/>
<g><path d="M56 86 Q62 78 68 86" fill="none" stroke="#2b2233" stroke-width="3.6" stroke-linecap="round"/><path d="M92 86 Q98 78 104 86" fill="none" stroke="#2b2233" stroke-width="3.6" stroke-linecap="round"/></g>
<ellipse cx="50" cy="96" rx="8" ry="4.6" fill="#ff7a9c" opacity=".38"/><ellipse cx="110" cy="96" rx="8" ry="4.6" fill="#ff7a9c" opacity=".38"/>
