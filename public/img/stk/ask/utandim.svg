<path d="M80 136 C42 112 22 88 22 66 C22 45 37 33 54 33 C66 33 75 40 80 50 C85 40 94 33 106 33 C123 33 138 45 138 66 C138 88 118 112 80 136Z" fill="url(#h)"/>
