<ellipse cx="50" cy="96" rx="8" ry="4.6" fill="#ff7a9c" opacity=".38"/><ellipse cx="110" cy="96" rx="8" ry="4.6" fill="#ff7a9c" opacity=".38"/><path d="M46 98 L30 94 M46 103 L30 105 M114 98 L130 94 M114 103 L130 105" stroke="#2b2233" stroke-width="2" stroke-linecap="round" opacity=".55"/>
<path d="M71 102 Q75.5 108 80 102 Q84.5 108 89 102" fill="none" stroke="#2b2233" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
