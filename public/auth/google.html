<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Google ile giriş · SwipeUp</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <style>
    :root { --bg: #fff; --text: #16161a; --muted: #62626e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0e; --text: #f3f3f6; --muted: #a0a0ad; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { padding: 32px 20px; max-width: 380px; width: 100%; }
    img { width: 64px; height: 64px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 16px 0 6px; }
    p { color: var(--muted); margin: 0 0 22px; font-size: 14.5px; }
    #g { display: flex; justify-content: center; min-height: 44px; }
    #msg { margin-top: 18px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="SwipeUp">
    <h1>Google ile devam et</h1>
    <p>Google hesabını seç; giriş bitince SwipeUp uygulamasına geri dönersin.</p>
    <div id="g"></div>
    <div id="msg"></div>
  </main>
  <script src="/auth/google.js"></script>
</body>
</html>
