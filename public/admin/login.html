<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>SwipeUp Yönetim</title>
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <!-- Girişten önce yalnızca bu sayfa açılır; panelin kendi dosyaları giriş yapınca verilir -->
  <style>
:root {
  --bg: #f6f6f8; --panel: #ffffff; --soft: #f1f1f4; --line: #e5e5ea; --text: #15151a; --muted: #6d6d78;
  --brand: #f2435a; --grad: linear-gradient(120deg, #ff8a3d, #ff3d6e); --ok: #12a05c; --warn: #c27c00; --bad: #d92d43; --info: #2b7bdc;
  --r: 14px; --side: 236px;
  --display: "Bricolage Grotesque", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0d10; --panel: #16161b; --soft: #1e1e25; --line: #2a2a33; --text: #f2f2f5; --muted: #9a9aa6; --ok: #34c77b; --warn: #e6a630; --bad: #ff5a6e; --info: #5aa2ff; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: var(--text); }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; flex: none; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.01em; margin: 0; }

/* Giriş */
.login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.login form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: grid; gap: 12px; }
.login .brand { justify-content: center; margin-bottom: 6px; }
.login p { margin: 0 0 6px; color: var(--muted); text-align: center; }
.err { color: var(--bad); min-height: 20px; text-align: center; font-size: 13px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.03em; padding: 4px 8px 14px; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; display: block; }
.brand small { font-family: var(--font); font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 650; background: var(--soft); border: 1px solid var(--line); white-space: nowrap; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--grad); color: #fff; border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.solid-danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn.ok { color: var(--ok); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.field { width: 100%; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); outline: none; }
.field:focus { border-color: var(--brand); }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 60; width: min(420px, calc(100% - 24px)); }
.toast { background: var(--text); color: var(--bg); padding: 11px 14px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); animation: dr .2s; }
@keyframes dr { from { transform: translateX(30px); opacity: 0; } }
.lg-f h3 { margin: 0; text-align: center; font-size: 18px; }
.lg-or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
.lg-or::before, .lg-or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.lg-g { display: flex; justify-content: center; min-height: 44px; }
.lg-f .link { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; font-size: 13.5px; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }
.lg-note { font-size: 12.5px !important; }
.lg-code { text-align: center; font-size: 22px; letter-spacing: .18em; font-variant-numeric: tabular-nums; }
.lg-steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; line-height: 1.4; }
.lg-qr { background: #fff; border-radius: 14px; padding: 10px; width: 200px; height: 200px; margin: 4px auto; }
.lg-qr svg { width: 100%; height: 100%; display: block; }
.lg-man summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.lg-key { display: block; padding: 10px; border-radius: 10px; background: var(--bg); font-size: 15px; letter-spacing: .06em; word-break: break-all; text-align: center; user-select: all; }
.lg-rcs { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: grid; gap: 12px; }
.lg-codes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lg-codes code { padding: 8px 4px; border-radius: 10px; background: var(--bg); text-align: center; font-size: 13px; white-space: nowrap; user-select: all; }
.lg-ok { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="login.js"></script>
</body>
</html>
