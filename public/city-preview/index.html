<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172d39">
  <title>SwipeUp City · Şehir Turu</title>
  <link rel="stylesheet" href="./city.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <main id="city" aria-label="SwipeUp City üç boyutlu oyun alanı">
    <div id="scene"></div>
    <header class="top">
      <a class="brand" href="/#/city" aria-label="SwipeUp City menüsüne dön">
        <span class="brand-mark" aria-hidden="true">S</span><span>SWIPEUP <strong>CITY</strong></span>
      </a>
      <button id="reset" class="reset" type="button" hidden>Yeniden başla</button>
    </header>
    <section id="tour" class="tour" aria-label="Şehir turu" hidden>
      <div class="tour-heading"><h1>Şehir turu</h1><span id="count">0 / 4</span></div>
      <ol id="stops"></ol>
      <p id="hint" aria-live="polite"></p>
    </section>
    <aside id="map" class="map" aria-label="Şehir haritası, kuzey üstte" hidden>
      <canvas id="minimap" width="200" height="200"></canvas>
      <span id="district"></span>
    </aside>
    <p id="keys" class="keys" hidden><kbd>WASD</kbd> Hareket <kbd>Fare</kbd> Bak <kbd>Shift</kbd> Koş <kbd>Space</kbd> Zıpla</p>
    <button id="activity" class="activity" type="button" aria-pressed="false" hidden>Egzersize katıl</button>
    <div id="touch" class="touch" hidden>
      <div class="joystick" aria-hidden="true"><span></span></div>
      <div class="actions">
        <button id="run" type="button" aria-pressed="false">Koş</button>
        <button id="jump" type="button">Zıpla</button>
      </div>
    </div>
    <section id="intro" class="intro">
      <h1>SwipeUp City</h1>
      <p>Kıyı Meydanı’ndan sahile in. Dört durağı keşfet ve açık hava egzersizine katıl.</p>
      <button id="start" type="button" disabled>Şehre gir <span aria-hidden="true">→</span></button>
      <p id="how">WASD ile hareket et. Kamerayı çevirmek için fareyi sürükle.</p>
    </section>
  </main>
</body>
</html>
