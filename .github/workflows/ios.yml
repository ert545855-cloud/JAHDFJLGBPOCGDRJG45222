name: iOS IPA

# İmzasız iOS uygulaması (IPA): ios-app/ klasöründeki Capacitor projesi (swipeup.live'ı tam ekran açan kabuk).
# App Store'a yükleme Xcode'dan yapılır (ios-app/CLAUDE.md).
# İmzasız olduğu için doğrudan App Store'a gitmez; Sideloadly / AltStore gibi araçlarla kendi Apple kimliğinle imzalanıp kurulur.
# App Store / TestFlight için Apple Developer hesabı (yıllık ücretli) ve imza sertifikası gerekir.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - '!ios-app/yayin.txt'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Xcode
        run: |
          # Capacitor 8 en az Xcode 26 ister; kurulu en yeni kararlı Xcode'u seç (beta değil)
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: iOS projesini hazırla (ios-app/)
        run: |
          cd ios-app
          npm ci --no-audit --no-fund
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Print" ios/App/App/Info.plist | head -40

      - name: Derle (imzasız)
        run: |
          cd ios-app/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee "$GITHUB_WORKSPACE/ios-build.log" | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/SwipeUp.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/SwipeUp.ipa"

      - name: Yayınla
        run: |
          VER="1.0.${{ github.run_number }}"
          cat > notes.md <<EOF
          SwipeUp iOS $VER (imzasız)

          Bu IPA imzasızdır: iPhone'a doğrudan kurulmaz. Sideloadly ya da AltStore ile kendi Apple kimliğinle imzalayıp kurabilirsin
          (ücretsiz Apple kimliğiyle 7 gün geçerli, sonra yeniden imzalanır). App Store / TestFlight için Apple Developer hesabı gerekir.

          Kaynak: ${GITHUB_REF_NAME} (${GITHUB_SHA::7})
          EOF
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest SwipeUp.ipa ios-build.log --prerelease --target "$GITHUB_SHA" \
            --title "SwipeUp iOS $VER" --notes-file notes.md
