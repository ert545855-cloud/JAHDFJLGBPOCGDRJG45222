name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-apk]
    paths:
      - 'store/android/**'
      - 'scripts/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUT: android-build
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      GH_TOKEN: ${{ github.token }}
      KEY_URL: https://swipeup.live/api/internal/android-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android projesini üret
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          mkdir -p /tmp/bw && cd /tmp/bw && npm init -y >/dev/null && npm i --no-audit --no-fund @bubblewrap/core@^1
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/bw/node_modules node scripts/android/generate.js "$OUT" "${{ github.run_number }}"

      - name: İmza anahtarı
        # Bu adımın çıktısı build.log'a yazılmaz (şifre sızmasın).
        run: |
          if [ -z "$KS_B64" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            TOK=$(curl -sS "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=swipeup-android" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value // empty')
            echo "::add-mask::$TOK"
            for i in $(seq 1 12); do
              # Sunucu uyuyor ya da yeni sürüm yükleniyor olabilir; ~10 dakika boyunca tekrar dener.
              RES=$(curl -sS -m 90 -X POST -H "Authorization: Bearer $TOK" "$KEY_URL" 2>/dev/null || true)
              KS_B64=$(echo "$RES" | jq -r '.keystore // empty' 2>/dev/null || true)
              KS_SECRET=$(echo "$RES" | jq -r '.pass // empty' 2>/dev/null || true)
              [ -n "$KS_SECRET" ] && break
              echo "Sunucudan anahtar alınamadı (deneme $i): $(echo "$RES" | jq -r '.error // "yanıt yok"' 2>/dev/null)"
              sleep 40
            done
          fi
          if [ -n "$KS_B64" ] && [ -n "$KS_SECRET" ]; then
            echo "::add-mask::$KS_SECRET"
            echo "$KS_B64" | base64 -d > "$OUT/android.keystore"
            PASS="$KS_SECRET"; KIND=kalici
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$OUT/android.keystore" -alias swipeup -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=SwipeUp, O=SwipeUp, C=TR" >/dev/null 2>&1
            KIND=gecici
          fi
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          echo "KEY_KIND=$KIND" >> "$GITHUB_ENV"
          echo "Anahtar: $KIND" | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Derle
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          cd "$OUT"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: İmzala
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          cd "$OUT"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-pass env:KS_PASS --ks-key-alias swipeup \
            --key-pass env:KS_PASS --out "$GITHUB_WORKSPACE/SwipeUp.apk" aligned.apk
          jarsigner -keystore android.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "$GITHUB_WORKSPACE/SwipeUp.aab" app/build/outputs/bundle/release/app-release.aab swipeup
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/SwipeUp.apk"
          FP=$("$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/SwipeUp.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}' | tr a-f A-F | sed 's/../&:/g;s/:$//')
          echo "FP=$FP" >> "$GITHUB_ENV"
          ls -la "$GITHUB_WORKSPACE"/SwipeUp.*

      - name: Yayınla
        run: |
          VER="1.0.${{ github.run_number }}"
          if [ "$KEY_KIND" = kalici ]; then KEYNOTE="Kalıcı anahtarla imzalandı."; else KEYNOTE="Geçici anahtarla imzalandı (her derlemede değişir; güncelleme için eski sürümü silip kurmak gerekir)."; fi
          printf '%s\n\n%s\n\nSHA-256 parmak izi:\n`%s`\n\nKaynak: %s (%s)\n' \
            "SwipeUp Android $VER" "$KEYNOTE" "$FP" "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" > notes.md
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest SwipeUp.apk SwipeUp.aab build.log \
            --prerelease --target "$GITHUB_SHA" --title "SwipeUp Android $VER" --notes-file notes.md

      - name: Hata kaydı
        if: failure()
        run: |
          gh release delete android-log -y --cleanup-tag || true
          gh release create android-log build.log --prerelease --target "$GITHUB_SHA" \
            --title "Android derleme hatası #${{ github.run_number }}" --notes "Derleme başarısız; build.log dosyasına bak."
